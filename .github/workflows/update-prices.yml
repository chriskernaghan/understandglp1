name: Update prices

on:
  schedule:
    - cron: "15 5 * * *" # 05:15 UTC daily (06:15 UK in summer)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch and report, don't commit)"
        type: boolean
        default: false
      accept_swings:
        description: "Apply held price moves (only after checking them by hand)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch and apply prices
        id: prices
        env:
          ACCEPT_SWINGS: ${{ inputs.accept_swings && 'true' || 'false' }}
        run: node scripts/update-prices.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- public/pricing-data.js; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pricing-data.js
          git commit -m "chore(prices): daily update $(date -u +%F)"
          git push

      # Runs after the commit, so good prices still go live. Failing here is
      # deliberate: it's what makes GitHub email you.
      - name: Needs attention
        if: steps.prices.outputs.needs_attention == 'true'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::error::Dry run: some prices would be held back or providers are stale. Nothing was committed. Check the run summary."
          else
            echo "::error::Some prices were held back or providers have gone stale. Everything else was published. Check the run summary."
          fi
          exit 1
